<app-nav></app-nav>
<div class="container">
    <mat-card *ngIf="news">
        <mat-card-subtitle>{{ news.date }}</mat-card-subtitle>
        <mat-card-title class="mat-subheading-2">{{ news.title | uppercase }}</mat-card-title>
        <img mat-card-image [src]="news.imageUrl" alt="Image news">
        <mat-card-content [innerHTML]="news.largeDescription"></mat-card-content>
        <mat-card-actions>
            <div class="row">
                <div class="col">
                    <button mat-icon-button aria-label="Like" matBadge="8" matBadgePosition="before"
                        matBadgeColor="primary">
                        <mat-icon>thumb_up</mat-icon>
                    </button>
                    <button mat-icon-button aria-label="Comment" matBadge="12" matBadgePosition="before"
                        matBadgeColor="primary">
                        <mat-icon>question_answer</mat-icon>
                    </button>
                </div>
                <div class="col">
                    <button mat-icon-button aria-label="Share" matBadge="5" matBadgePosition="before"
                        matBadgeColor="primary">
                        <mat-icon>share</mat-icon>
                    </button>
                </div>
            </div>
        </mat-card-actions>
        <mat-card-footer></mat-card-footer>
    </mat-card>
</div>
